name: PodOS Nvidia

on:
  workflow_run:
    workflows:
      - PodOS Minimal
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Pull minimal image
        run: docker pull ghcr.io/mikucat0309/podos:latest

      - name: Get kernel version
        id: meta
        run: |
          version=$(docker run ghcr.io/mikucat0309/podos:latest rpm -q kernel-core --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}')
          echo "kernel-version=$version" >> $GITHUB_OUTPUT

      - name: Build nvidia image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: nvidia.Containerfile
          build-args: |
            KERNEL_VERSION=${{ steps.meta.outputs.kernel-version }}
          tags: ghcr.io/mikucat0309/podos:latest-nvidia
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
